# One command to run the whole backend tier: PostgreSQL + the NestJS API.
#   docker compose up --build
# The API waits for the DB to be healthy, then auto-creates the schema (DB_SYNC).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: synclog
      POSTGRES_PASSWORD: synclog
      POSTGRES_DB: synclog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synclog -d synclog"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    environment:
      PORT: 3000
      PUBLIC_URL: http://localhost:3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: synclog
      DB_PASSWORD: synclog
      DB_NAME: synclog
      DB_SYNC: "true"
      JWT_SECRET: dev-secret-change-me
      JWT_EXPIRES: 30d
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
